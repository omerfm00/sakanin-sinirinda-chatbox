services:
  api:
    restart: unless-stopped
    environment:
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:${STUDENT_PROD_PORT:-8081},http://localhost:${TEACHER_PROD_PORT:-8082},http://localhost:${ADMIN_PROD_PORT:-8083}}

  student-web:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_STUDENT_APP_URL: ${STUDENT_APP_URL:-http://localhost:${STUDENT_PROD_PORT:-8081}}
        VITE_TEACHER_APP_URL: ${TEACHER_APP_URL:-http://localhost:${TEACHER_PROD_PORT:-8082}}
        VITE_ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:${ADMIN_PROD_PORT:-8083}}
    ports:
      - "${STUDENT_PROD_PORT:-8081}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  teacher-web:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_STUDENT_APP_URL: ${STUDENT_APP_URL:-http://localhost:${STUDENT_PROD_PORT:-8081}}
        VITE_TEACHER_APP_URL: ${TEACHER_APP_URL:-http://localhost:${TEACHER_PROD_PORT:-8082}}
        VITE_ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:${ADMIN_PROD_PORT:-8083}}
    ports:
      - "${TEACHER_PROD_PORT:-8082}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-web:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_STUDENT_APP_URL: ${STUDENT_APP_URL:-http://localhost:${STUDENT_PROD_PORT:-8081}}
        VITE_TEACHER_APP_URL: ${TEACHER_APP_URL:-http://localhost:${TEACHER_PROD_PORT:-8082}}
        VITE_ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:${ADMIN_PROD_PORT:-8083}}
    ports:
      - "${ADMIN_PROD_PORT:-8083}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

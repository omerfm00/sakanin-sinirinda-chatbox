services:
  api:
    build:
      target: development
    command: npm run start:dev --workspace apps/api
    environment:
      NODE_ENV: development
    volumes:
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "3000:3000"

  student-web:
    build:
      target: student-development
    command: npm run dev --workspace apps/student-web -- --host 0.0.0.0
    volumes:
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  teacher-web:
    build:
      target: teacher-development
    command: npm run dev --workspace apps/teacher-web -- --host 0.0.0.0
    volumes:
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-web:
    build:
      target: admin-development
    command: npm run dev --workspace apps/admin-web -- --host 0.0.0.0
    volumes:
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "5175:5175"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5175').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
